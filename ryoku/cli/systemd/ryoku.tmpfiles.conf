# /var/lib/ryoku: the boot guard's marker (root-owned). /var/lib/ryoku/boot:
# sticky and world-writable so a session can record that the desktop came up
# (ok-<uid>, written by the shell daemon) for the root-side guard to read.
d /var/lib/ryoku 0755 root root -
d /var/lib/ryoku/boot 1777 root root -
