[Unit]
# niri is started as its own user unit (niri-session starts niri.service), which
# makes it the one place a login can be ordered deterministically: pull the config
# bootstrap in and wait for it before the compositor reads ~/.config/niri. Without
# this the first login after a package install is a bare compositor, and Ryoku's
# tree only appears on the second one.
Wants=ryoku-bootstrap.service
After=ryoku-bootstrap.service
