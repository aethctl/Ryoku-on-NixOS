# Ryoku session environment, read by the systemd user manager at login.
#
# Hyprland sets these from env.lua; niri has no such hook, so anything it spawns
# ran without them. $HOME expands here, so one file serves every user.
#
# Compositor-specific values (backend ABI hints, HYPRCURSOR_*) stay in env.lua.

XCURSOR_THEME=Bibata-Modern-Ice
XCURSOR_SIZE=24

# /usr/lib/qt6/qml on a package install; ~/.local/lib/qt6/qml from a checkout.
# A keybind-launched `qs -c <name>` has no other way to reach Ryoku's modules.
QML_IMPORT_PATH=$HOME/.local/lib/qt6/qml
QML2_IMPORT_PATH=$HOME/.local/lib/qt6/qml

PATH=$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin

# qt6ct: the kde platform theme needs plasma-integration, which Ryoku does not
# ship, so plain Qt apps would lose their palette and font.
QT_QPA_PLATFORMTHEME=qt6ct

GDK_BACKEND=wayland,x11,*
QT_QPA_PLATFORM=wayland;xcb
QT_AUTO_SCREEN_SCALE_FACTOR=1
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
ELECTRON_OZONE_PLATFORM_HINT=auto

# GTK4's default renderer needs Mutter's ServiceChannel and hangs on wlroots.
GSK_RENDERER=gl

# The shell daemon registers as the PolicyKit1 agent when it reads this.
RYOKU_POLKIT_AGENT=1

EDITOR=nvim
VISUAL=nvim
