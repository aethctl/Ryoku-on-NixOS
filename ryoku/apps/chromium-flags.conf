--password-store=gnome-libsecret
# Native Wayland, not Xwayland. On Xwayland a Chromium browser never reaches the
# PipeWire capturer (getDisplayMedia falls back to X11 capture, blind to Wayland
# windows) and on an NVIDIA Xwayland it can render pages blank. Laid as both
# chromium-flags.conf and chrome-flags.conf so Google Chrome reads it too.
--ozone-platform=wayland
