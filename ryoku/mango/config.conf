# Ryoku's mango config. mango reads exactly one file, so this is the top
# level and everything else is sourced from here.
#
# Two mango rules shape this file:
#
# A missing source file is an ERROR line, not fatal: the session boots with
# the rest of the tree. Ryoku still ships every file below and ryoku-wm-mango
# always writes both generated files, even when they would be empty, so the
# tree is whole from first login and the error log stays clean.
#
# The LAST source wins for a value set twice (measured on a live instance:
# "Using last definition for conflicting fields"), so source order is the
# override chain: machine seeds, then the desktop's generated config, then
# your own file.

# The login bootstrap, run once when mango starts. It carries no settings
# values, so it sits above the override chain rather than in its tail, and
# before user.conf so your file stays the last word.
source=./autostart.conf
source=./lid.conf

# Seeded once, then owned by this machine. keyboard.conf is yours to edit; gpu
# and monitors are rewritten at runtime on a GPU reset or a hotplug. env=
# lines live here, not in the generated files, because a reload re-sources
# them and must never drop the GPU pin or the IM setup.
source=./keyboard.conf
source=./gpu.conf
source=./monitors.conf
# Hand-written display pins, loaded after the generated monitors.conf so a
# forced mode or a fixed layout wins over autoscale.
source=./monitors_user.conf

# Written by ryoku-wm-mango from the neutral settings store: settings.conf is
# every desktop.* and wm.mango.* value in effect, rebinds.conf is the complete
# keybind set. Never hand-edit these, an update overwrites them; put changes
# in the Hub or in user.conf.
source=./settings.conf
source=./rebinds.conf

# The last word, and yours. Seeded once and never touched by an update.
source=./user.conf
