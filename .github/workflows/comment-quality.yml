name: Comment quality

# Keep newly added comments focused on constraints and intent rather than
# conversational filler or placeholder narration. The same check runs locally
# from the pre-commit hook.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      scope:
        description: Range to scan
        required: true
        default: changed
        type: choice
        options:
          - changed
          - all

permissions:
  contents: read

jobs:
  comments:
    name: Check added comments
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check added comments
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          SCOPE: ${{ github.event.inputs.scope || 'changed' }}
        run: |
          set -euo pipefail

          base=""
          head="$SHA"

          case "$EVENT" in
            pull_request)
              base="$PR_BASE"
              head="$PR_HEAD"
              ;;
            push)
              base="$PUSH_BEFORE"
              if [[ -n "$base" ]] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
                base="$(git rev-parse HEAD~1 2>/dev/null || true)"
              fi
              ;;
            *)
              if [[ "$SCOPE" != "all" ]]; then
                base="$(git rev-parse HEAD~1 2>/dev/null || true)"
              fi
              ;;
          esac

          echo "Checking range: ${base:-<empty-tree>}..$head"
          bin/ryoku-dev-check-comments --range "$base" "$head"
