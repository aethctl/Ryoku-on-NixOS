name: Build ISO

# plain-Arch variant. fires on a v* release tag (cut from main) or a manual
# dispatch, and calls the reusable builder with variant=plain. this workflow's
# own run counter is the tracking id (r<run> surfaced as "R<run>" on the site),
# so plain keeps its established sequence.
on:
  workflow_dispatch:
    inputs:
      release_stage:
        description: 'Public release stage'
        required: true
        default: 'beta'
        type: choice
        options:
          - alpha
          - beta
          - stable
      repo_url:
        description: '[ryoku] repo to bake from (a releases/<tag>/x86_64 URL); empty = stable pointer'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # the reusable builder's Trivy step uploads the ISO scan as SARIF.
  security-events: write

jobs:
  build:
    uses: ./.github/workflows/build-iso-reusable.yml
    with:
      variant: plain
      release_stage: ${{ github.event.inputs.release_stage || 'beta' }}
      repo_url: ${{ github.event.inputs.repo_url || '' }}
    secrets: inherit
