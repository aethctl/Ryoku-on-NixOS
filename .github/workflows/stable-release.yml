name: Stable Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Release number to bump (none tags the VERSION main already carries)
        required: true
        default: none
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      release_stage:
        description: Public release stage (keep leaves the current suffix)
        required: true
        default: keep
        type: choice
        options:
          - keep
          - alpha
          - beta
          - stable

permissions:
  contents: write
  actions: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    name: Bump VERSION and tag stable release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        shell: bash
        run: |
          set -euo pipefail

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Compute release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          # bump none: a release is a named, frozen copy of what main already
          # is, so the tag takes VERSION as it stands (the unstable bump bot
          # advances it on every unstable-dev push; main inherits the value at
          # fast-forward). a bump rewrites VERSION on main first.
          if [[ "${{ inputs.bump_type }}" == none ]]; then
            if [[ "${{ inputs.release_stage }}" != keep ]]; then
              echo "::error::bump_type none tags the current VERSION; release_stage must be keep."
              exit 1
            fi
            version="$(tr -d '[:space:]' < VERSION)"
          else
            version="$(./bin/ryoku-release-bump "${{ inputs.bump_type }}" "${{ inputs.release_stage }}")"
            printf '%s\n' "$version" > VERSION
          fi
          tag="v$version"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Release tag $tag already exists."
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Stable release"
            echo
            echo "- Name: \`$(tr -d '[:space:]' < CODENAME)\`"
            echo "- Version: \`$version\`"
            echo "- Tag: \`$tag\`"
            echo "- Stage: \`${{ inputs.release_stage }}\`"
            echo "- Bump: \`${{ inputs.bump_type }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and tag release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if ! git diff --quiet -- VERSION; then
            git add VERSION
            git commit -m "release: $RELEASE_TAG"
            git push origin HEAD:main
          fi
          git tag -a "$RELEASE_TAG" -m "Ryoku $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Dispatch repo publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          # a tag pushed by GITHUB_TOKEN doesn't fire publish-repo's tag
          # trigger, so dispatch it explicitly. publish-repo builds the frozen
          # releases/<tag>/ set, moves the stable pointer onto it, records the
          # release in the ledger, and dispatches the ISO build from that
          # directory once it is verified, so nothing here races the upload.
          gh workflow run publish-repo.yml --ref "$RELEASE_TAG"
          echo "::notice::Dispatched publish-repo.yml on $RELEASE_TAG."

      - name: Dispatch release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          # the release-notes workflow only reaches main once unstable-dev merges
          # in, so tolerate its absence on an older main instead of failing here.
          if gh workflow run release-notes.yml --ref main -f mode=stable -f ref="$RELEASE_TAG" 2>/tmp/rn.err; then
            echo "::notice::Dispatched release-notes.yml for $RELEASE_TAG."
          else
            echo "::warning::release-notes.yml not dispatched: $(cat /tmp/rn.err)"
          fi
